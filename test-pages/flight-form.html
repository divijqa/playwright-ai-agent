<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Test Flight Form</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; }
    .form { max-width: 800px; margin: 0 auto; }
    input { padding: .5rem; width: 100%; margin-bottom: .5rem; }
    button { padding: .6rem 1rem; }
  </style>
</head>
<body>
  <div class="form">
    <h1>Flight Status (Test Page)</h1>
    <label for="flightStatusForm-origin">From</label>
    <input id="flightStatusForm-origin" name="origin" placeholder="From" aria-label="From city or airport" />

    <label for="flightStatusForm-destination">To</label>
    <input id="flightStatusForm-destination" name="destination" placeholder="To" aria-label="To city or airport" />

    <label for="flightStatusForm-flightNumber">Flight number (optional)</label>
    <input id="flightStatusForm-flightNumber" name="flightNumber" placeholder="Flight Number" aria-label="Flight number" />

    <button id="searchBtn" type="button">Search</button>
    <p id="searchError" role="alert" hidden></p>
    <main id="searchResults" hidden>
      <h2>Flight search results</h2>
      <p id="resultsMessage"></p>
    </main>
  </div>

  <script>
    document.getElementById('searchBtn').addEventListener('click', () => {
      const origin = document.getElementById('flightStatusForm-origin').value;
      const dest = document.getElementById('flightStatusForm-destination').value;
      const flightNumber = document.getElementById('flightStatusForm-flightNumber').value;
      const error = document.getElementById('searchError');
      const results = document.getElementById('searchResults');
      const message = document.getElementById('resultsMessage');
      const validCodes = /^(DFW|LAX|JFK|ORD|ATL|SFO)$/;

      error.hidden = true;
      results.hidden = true;

      if (!validCodes.test(origin) || !validCodes.test(dest) || origin === dest) {
        error.textContent = 'Please enter valid airport codes';
        error.hidden = false;
        return;
      }

      if (flightNumber && !/^[A-Z]{2}\d{1,4}$/.test(flightNumber)) {
        error.textContent = 'No flights found';
        error.hidden = false;
        return;
      }

      message.textContent = 'Flight search results: ' + origin + ' to ' + dest;
      results.hidden = false;
    });
  </script>
</body>
</html>
